plugins {
    // Lets Gradle auto-provision JDK toolchains (the Hytale module targets Java 25).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'analyse'

include 'modules:sdk'
include 'modules:api'
include 'modules:spigot'
include 'modules:velocity'
include 'modules:bungeecord'
include 'modules:hytale'
