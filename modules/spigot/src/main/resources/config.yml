# Analyse Plugin Configuration

# Enable debug logging for troubleshooting
debug: false

# Your server's API key from the Analyse dashboard
api-key: "anl_your_api_key_here"

# How Bedrock (Floodgate/Geyser) players are detected.
# NAME: match the username against bedrock-prefix below.
# UUID: detect by UUID - Floodgate gives Bedrock players a UUID of the form
#       00000000-0000-0000-xxxx-xxxxxxxxxxxx. More reliable, as it won't flag
#       Java players whose name happens to start with the prefix.
bedrock-mode: "NAME"

# Bedrock player username prefix (used by Floodgate/Geyser)
# Only used when bedrock-mode is NAME.
# Common values: "." or "_" or "*"
# Leave empty to disable name-based bedrock detection
bedrock-prefix: "."

# Instance ID for multi-instance setups (e.g. "survival-1", "survival-2")
# Used to identify this specific server instance in heartbeats
instance-id: "default"

# Batch sending settings. Joins, leaves, and custom events are queued in memory
# and sent together using /v1/plugin/batch.
batch:
  # Number of queued items that triggers an immediate flush.
  # Recommended: 100-250. Maximum API batch size is 1000.
  size: 200

  # How often queued items are flushed, in seconds.
  # Recommended: 2-5 seconds.
  flush-interval-seconds: 3

  # Maximum queued items kept in memory before new items are rejected.
  max-queue-size: 10000

  # Number of retry attempts for temporary HTTP/network failures.
  max-retries: 3

# Built-in event tracking
# These events are automatically sent when players perform actions
# Useful for session insights and understanding player behavior
# High-frequency events (block-place, block-break, death, kill-entity) are disabled by default
events:
  chat: true
  command: true
  block-place: false
  block-break: false
  death: false
  kill-entity: false
